# MadeMeDance: built, signed and published by HereLiesAz/workflows (.github/workflows/android-play-release.yml):
# Google Play on the shared tracks.
# This file is the trigger contract; the central sync replaces it with a tracker.
name: Android Play Release
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "libs/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "version.properties"
  workflow_dispatch:
permissions: {}
jobs:
  hand-off:
    runs-on: ubuntu-latest
    steps:
      - run: echo "MadeMeDance Android Play Release runs centrally in HereLiesAz/workflows."
